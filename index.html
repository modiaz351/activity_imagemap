<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Map Activity</title>
</head>

<body>

    <h1>Image Map Activity</h1>

    <p> Misael Diaz </p>

    <p> September 5, 2026</p>

    <img src="media/ch03_image-to-map.jpg" alt="Image used for the image map" usemap="#imagemap">

    <map name="imagemap">

        <area shape="rect"
              coords="470,1247,274,1599"
              href="https://www.google.com"
              alt="Rectangular link">

        <area shape="circle"
              coords="1529,1496,186"
              href="https://www.wikipedia.org"
              alt="Circular link">

        <area shape="poly"
              coords="150,1019,333,1013,342,921,207,906,156,900"
              href="https://www.youtube.com"
              alt="Polygon link">
    </map>
</body>
</html>
